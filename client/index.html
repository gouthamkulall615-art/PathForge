<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>PathForge — Open-Source Engineering Roadmaps &amp; Interactive Learning Trees</title>
    <meta
      name="description"
      content="PathForge is an open-source engineering roadmap platform. Interactive left-to-right node trees, skill-check onboarding, and 100% free curated learning resources across 10 engineering disciplines."
    />
    <link rel="canonical" href="https://path-forge-amber.vercel.app/" />

    <!-- Open Graph / Facebook (1200x630 OG image) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://path-forge-amber.vercel.app/" />
    <meta property="og:title" content="PathForge — Open-Source Engineering Roadmaps" />
    <meta
      property="og:description"
      content="Interactive node-tree roadmaps, deterministic skill-check onboarding quiz, and curated free resources. Zero paywalls."
    />
    <meta property="og:image" content="https://path-forge-amber.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PathForge Engineering Roadmaps Blueprint" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://path-forge-amber.vercel.app/" />
    <meta name="twitter:title" content="PathForge — Open-Source Engineering Roadmaps" />
    <meta
      name="twitter:description"
      content="Interactive node-tree roadmaps, deterministic skill-check onboarding quiz, and curated free resources."
    />
    <meta name="twitter:image" content="https://path-forge-amber.vercel.app/og-image.png" />

    <!-- JSON-LD Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PathForge",
      "operatingSystem": "Web",
      "applicationCategory": "EducationalApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Open-source engineering roadmap platform featuring interactive left-to-right node trees, deterministic skill-check personalization, and curated free resources."
    }
    </script>

    <!-- Font Preconnections & Preloads -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
